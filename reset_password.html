<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeKeep - Reset Password</title>
    <link rel="icon" type="image/png" href="./assets/logo.png">
    <link href="assets/bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="page-background body-register">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/safekeeplogo.png" alt="SafeKeep Logo" width="35" height="35" class="me-2" />
                <strong>SafeKeep</strong>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-wrapper">
            <div class="form-card">
                <!-- Form Header -->
                <div class="form-header">
                    <div class="form-icon-wrapper">
                        <img src="./assets/password-icon.png" alt="" class="form-header-icon">
                    </div>
                    <h1 class="form-title">Reset Password</h1>
                    <p class="form-subtitle">Enter your new password below</p>
                </div>

                <!-- Form -->
                <form class="registration-form" id="resetPasswordForm">
                    <!-- New Password -->
                    <div class="form-group">
                        <label class="form-label">
                            <img src="./assets/password-icon.png" alt="" class="label-icon">
                            New Password
                        </label>
                        <input type="password" name="password" placeholder="Enter your new password" class="form-input" required minlength="6"/>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label class="form-label">
                            <img src="./assets/password-icon.png" alt="" class="label-icon">
                            Confirm Password
                        </label>
                        <input type="password" name="confirmPassword" placeholder="Confirm your new password" class="form-input" required minlength="6"/>
                    </div>

                    <!-- Submit Button -->
                    <div class="submit-wrapper">
                        <button type="submit" class="submit-button">
                            <img src="./assets/password-icon.png" alt="" class="button-icon">
                            Reset Password
                        </button>
                    </div>
                </form>

                <!-- Form Footer -->
                <div class="form-footer">
                    <p>Remember your password? <a href="login.html" class="login-link">Login here</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get token from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alert('Invalid reset link. Please request a new password reset.');
            window.location.href = 'forgotpassword.html';
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            
            // Validate form
            if (!password || !confirmPassword) {
                alert('Please fill in all fields.');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }
            
            // Submit password reset
            try {
                const button = this.querySelector('button[type="submit"]');
                button.disabled = true;
                button.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';
                
                const response = await fetch('api/reset_password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('Password reset successful! You can now login with your new password.');
                    window.location.href = 'login.html';
                } else {
                    alert(result.error || 'Password reset failed. Please try again.');
                }
            } catch (error) {
                console.error('Reset error:', error);
                alert('Network error. Please check your connection and try again.');
            } finally {
                const button = this.querySelector('button[type="submit"]');
                button.disabled = false;
                button.innerHTML = '<img src="./assets/password-icon.png" alt="" class="button-icon">Reset Password';
            }
        });
    </script>

</body>
</html>
