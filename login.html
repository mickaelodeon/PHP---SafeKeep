<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeKeep</title>
    <link rel="icon" type="image/png" href="./assets/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="page-background body-login">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="assets/safekeeplogo.png" alt="SafeKeep Logo" width="35" height="35" class="me-2" />
          <strong>SafeKeep</strong>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="browse.php">Browse Items</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-primary fw-bold" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="register.html">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="form-wrapper">
        <div class="form-card">
          <div class="form-header">
            <div class="form-logo-wrapper">
              <img
                src="./assets/logo.png"
                alt="SafeKeep Logo"
                class="form-logo"
              />
            </div>
            <h1 class="form-title">SafeKeep</h1>
            <p class="form-subtitle">Secure School Management System</p>
          </div>

          <form class="login-form">
            <div class="form-group">
              <input
                type="email"
                name="email"
                placeholder="Email Address"
                class="form-input"
              />
            </div>

            <div class="form-group">
              <div class="password-input-wrapper">
                <input
                  type="password"
                  id="password-input"
                  name="password"
                  placeholder="Password"
                  class="form-input"
                />
              </div>
            </div>

            <div class="form-options">
              <div class="remember-me">
                <input
                  type="checkbox"
                  id="rememberMe"
                  name="rememberMe"
                  class="form-checkbox"
                />
                <label for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="forgot-password-link">Forgot Password?</a>
            </div>

            <div class="submit-wrapper">
              <button type="submit" class="submit-button">
                <img src="./assets/login-icon.png" alt="" class="button-icon" />
                Login
              </button>
            </div>
          </form>

          <div class="form-footer">
            <p>
              Don't have an account?
              <a href="register.html" class="footer-link">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </main>
    
    <script>
        document.querySelector('.login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = this.querySelector('input[name="email"]').value;
            const password = this.querySelector('input[name="password"]').value;
            const submitBtn = this.querySelector('.submit-button');
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span style="margin-right: 8px;">⏳</span>Logging in...';
            
            try {
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store user info for dashboard
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('userRole', data.user.role);
                    
                    // Redirect based on user role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.php';
                    } else {
                        window.location.href = 'dashboard.php';
                    }
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Network error. Please try again.');
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<img src="./assets/login-icon.png" alt="" class="button-icon" />Login';
            }
        });
    </script>
  </body>
</html>
